buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'kr.co.studio0610.zsui'
version = new groovy.json.JsonSlurper().parse(file('../package.json')).version

android {
  namespace "kr.co.studio0610.zsui"
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'androidx.window:window:1.5.1'
  implementation 'androidx.window:window-core:1.5.1'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
  implementation 'com.facebook.react:react-android'

  implementation 'androidx.compose.ui:ui-android:1.12.1'
  implementation 'androidx.compose.foundation:foundation-android:1.12.1'
  implementation 'androidx.compose.material3:material3-android:1.5.0-beta01'
  implementation 'androidx.core:core-ktx:1.18.0'
}
