# example의 workspace 링크에 루트를 포함한다.
packages:
  - '.'
  - 'example'
  - 'docs'

# 개발·문서 도구의 보안 패치(Node 20+).
overrides:
  '@docusaurus/core@3.10.2>tinypool': 2.1.2
  'brace-expansion@5.0.9': 5.0.12
  'handlebars@4.7.9': 4.7.10

# 배너·사전 빌드 바이너리의 대체 설치 스크립트는 실행하지 않는다.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - core-js
  - core-js-pure
  - unrs-resolver
