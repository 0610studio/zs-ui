appId: kr.co.studio0610.zsui.example
---
- runFlow:
    file: common/open-calendar-advanced.yaml
    env:
      DATE: '2026-09-02'
- waitForAnimationToEnd
- tapOn:
    id: 'fps-reset'

- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT

- repeat:
    times: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: UP
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: DOWN

- waitForAnimationToEnd
- runFlow:
    when:
      visible: '2026년 8월'
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
- runFlow:
    when:
      visible: '2026년 10월'
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT
- extendedWaitUntil:
    visible: '2026년 9월'
    timeout: 5000

- tapOn:
    id: 'calendar-cell-2026-09-11'
- tapOn:
    id: 'calendar-cell-2026-09-20'
- tapOn:
    id: 'calendar-cell-2026-09-03'

- swipe:
    from:
      id: 'diary-list'
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: f01-after-stress

- copyTextFrom:
    id: 'fps-probe'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertTrue: ${parseInt(maestro.copiedText.match(/UI \d+ \(min (\d+)\)/)[1], 10) >= 50}
      - assertTrue: ${parseInt(maestro.copiedText.match(/JS \d+ \(min (\d+)\)/)[1], 10) >= 30}
