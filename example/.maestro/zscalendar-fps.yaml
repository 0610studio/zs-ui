# 성능 — 스와이프·주↔월 전환·날짜 탭·리스트 스크롤을 연달아 걸고 UI/JS 스레드 최저 FPS 를 읽는다.
# FpsProbe(example 전용, __DEV__) 가 1초 창 단위로 "UI n (min m) / JS n (min m)" 을 표시한다.
appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
# Android 콜드 스타트는 Metro 번들 로드까지 1분 가까이 걸린다 — 홈이 뜬 뒤에 스크롤한다
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'calendar-card'
    direction: DOWN
- tapOn:
    id: 'calendar-card'
- assertVisible:
    id: 'diary-calendar-grid'
- extendedWaitUntil:
    visible: '.*일정 .*건.*'
    timeout: 8000
- waitForAnimationToEnd
- tapOn:
    id: 'fps-reset'

# 좌우 페이징 3왕복
- repeat:
    times: 3
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT

# 주↔월 전환 2왕복
- repeat:
    times: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: UP
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: DOWN

# 날짜 탭 3회 (선택 pane 재기록 경로)
- tapOn:
    id: 'calendar-cell-2026-09-11'
- tapOn:
    id: 'calendar-cell-2026-09-20'
- tapOn:
    id: 'calendar-cell-2026-09-03'

# 리스트 스크롤로 접기
- swipe:
    from:
      id: 'diary-list'
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: f01-after-stress

- copyTextFrom:
    id: 'fps-probe'
# 임계값은 iOS 시뮬레이터(실측 UI 57~58 / JS 53~54)에만 건다. Android 에뮬레이터는 빌드 종류에 따라 크게 달라
# 회귀 판정 기준으로 쓸 수 없다 — 스크린샷으로만 남긴다. 2026-09-02 실측(구간별 최저, 월 100~160건):
#   debug(dev client)  페이징 UI 53 / JS 49 · 주↔월 58 / 52 · 날짜 탭 59 / 47 · 리스트 스크롤 59 / 58
#   release            페이징 UI 58 / JS 58 · 주↔월 59 / 59 · 날짜 탭 60 / 59 · 리스트 스크롤 58 / 58
# 릴리스에서 계측하려면 EXPO_PUBLIC_DEV_STRIP=1 로 빌드해 개발용 띠(fps-probe)를 켠다.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertTrue: ${parseInt(maestro.copiedText.match(/UI \d+ \(min (\d+)\)/)[1], 10) >= 50}
      - assertTrue: ${parseInt(maestro.copiedText.match(/JS \d+ \(min (\d+)\)/)[1], 10) >= 30}
