appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- runFlow: ../common/open-lab.yaml
- scrollUntilVisible:
    element:
      id: 'lab-sidebar-tabs-card'
    direction: DOWN
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-sidebar-tabs-card'
      - assertVisible:
          id: 'lab-sidebar-tabs-value'
- assertVisible:
    id: 'lab-sidebar-tabs-value'
    text: 'sidebar'
- waitForAnimationToEnd
- takeScreenshot: s01-portrait

- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: s02-landscape-sidebar

- runFlow:
    when:
      notVisible: 'Hide Sidebar'
    commands:
      - tapOn: 'Toggle sidebar'
      - waitForAnimationToEnd
- tapOn: 'Hide Sidebar'
- waitForAnimationToEnd
- assertVisible: 'Toggle sidebar'
- takeScreenshot: s02a-sidebar-hidden
- tapOn: 'Toggle sidebar'
- waitForAnimationToEnd
- assertVisible: 'Hide Sidebar'
- takeScreenshot: s02b-sidebar-reopened

- tapOn: '기록'
- assertVisible:
    id: 'lab-sidebar-tabs-records-title'
- takeScreenshot: s03-landscape-records
- tapOn: '홈'
- assertVisible:
    id: 'lab-sidebar-tabs-value'

- tapOn: 'tabBar'
- assertVisible:
    id: 'lab-sidebar-tabs-value'
    text: 'tabBar'
- waitForAnimationToEnd
- takeScreenshot: s04-landscape-tabbar

- tapOn: 'sidebar'
- setOrientation: PORTRAIT
- waitForAnimationToEnd
