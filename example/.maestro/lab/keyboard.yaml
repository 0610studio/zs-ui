appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- runFlow: ../common/open-lab.yaml
- scrollUntilVisible:
    element:
      id: 'lab-keyboard-card'
    direction: DOWN
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-keyboard-card'
      - assertVisible:
          id: 'lab-keyboard-field-2'

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-keyboard-field-2'
      - assertVisible:
          id: 'lab-keyboard-gap'
          text: 'zs · gap (1[4-9]|[2-9]\d|\d{3,})'
- waitForAnimationToEnd
- takeScreenshot: k01-zs-tap
- runFlow:
    file: ../common/keyboard-next.yaml
- extendedWaitUntil:
    visible:
      id: 'lab-keyboard-field-3'
    timeout: 3000
- assertVisible:
    id: 'lab-keyboard-gap'
    text: 'zs · gap 1[4-8]'
- runFlow:
    file: ../common/keyboard-next.yaml
- extendedWaitUntil:
    visible:
      id: 'lab-keyboard-field-4'
    timeout: 3000
- takeScreenshot: k02-zs-next
- assertVisible:
    id: 'lab-keyboard-gap'
    text: 'zs · gap 1[4-8]'

- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 400
      - assertVisible:
          id: 'lab-keyboard-card'
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-keyboard-card'
      - assertVisible:
          id: 'lab-keyboard-mode-rn'
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-keyboard-mode-rn'
      - assertVisible:
          id: 'lab-keyboard-gap'
          text: 'rn · .*'
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-keyboard-field-2'
      - assertVisible:
          id: 'lab-keyboard-gap'
          text: 'rn · gap -?\d+'
- waitForAnimationToEnd
- takeScreenshot: k03-rn-tap
- runFlow:
    file: ../common/keyboard-next.yaml
- takeScreenshot: k04-rn-next

- retry:
    maxRetries: 2
    commands:
      - swipe:
          start: 1%, 50%
          end: 85%, 50%
          duration: 400
      - assertVisible:
          id: 'lab-keyboard-card'
