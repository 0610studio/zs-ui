appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- runFlow: ../common/open-lab.yaml
- scrollUntilVisible:
    element:
      id: 'lab-overlay-placement-card'
    direction: DOWN
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-overlay-placement-card'
      - assertVisible:
          id: 'lab-overlay-alert'
- setOrientation: ${ORIENTATION}
- waitForAnimationToEnd

- runFlow:
    when:
      true: ${TARGET == 'alert'}
    commands:
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: 'lab-overlay-alert'
            - assertVisible: '접힘선 확인'
      - waitForAnimationToEnd
      - takeScreenshot: o01-alert-${LABEL}

- runFlow:
    when:
      true: ${TARGET == 'sheet'}
    commands:
      - scrollUntilVisible:
          element:
            id: 'lab-overlay-sheet'
          direction: DOWN
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: 'lab-overlay-sheet'
            - extendedWaitUntil:
                visible:
                  id: 'zs-bottom-sheet'
                timeout: 10000
      - waitForAnimationToEnd
      - takeScreenshot: o02-sheet-${LABEL}

- runFlow:
    when:
      true: ${TARGET == 'menu'}
    commands:
      - scrollUntilVisible:
          element: '메뉴'
          direction: DOWN
      - retry:
          maxRetries: 2
          commands:
            - tapOn: '메뉴'
            - assertVisible: '첫 번째'
      - waitForAnimationToEnd
      - takeScreenshot: o03-menu-${LABEL}

- runFlow:
    when:
      true: ${TARGET == 'snackbar'}
    commands:
      - scrollUntilVisible:
          element:
            id: 'lab-overlay-snackbar'
          direction: DOWN
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                id: 'lab-overlay-snackbar'
            - assertVisible: '화면 위에 뜬다'
      - takeScreenshot: o04-snackbar-${LABEL}
