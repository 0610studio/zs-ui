appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- runFlow: ../common/open-lab.yaml
- scrollUntilVisible:
    element:
      id: 'lab-environment-card'
    direction: DOWN
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-environment-card'
      - assertVisible:
          id: 'lab-environment-expo'
- scrollUntilVisible:
    element:
      id: 'lab-environment-use-system'
    direction: DOWN
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-environment-use-system'
      - assertVisible:
          id: 'lab-environment-theme-source'
          text: 'system'
- waitForAnimationToEnd
- takeScreenshot: h01-portrait

- copyTextFrom:
    id: 'lab-environment-theme-mode'
- retry:
    maxRetries: 2
    commands:
      - tapOn: '(라이트|다크) 모드로 전환'
      - assertVisible:
          id: 'lab-environment-theme-source'
          text: 'manual'
- assertNotVisible:
    id: 'lab-environment-theme-mode'
    text: ${maestro.copiedText}

- setOrientation: LANDSCAPE_LEFT
- waitForAnimationToEnd
- takeScreenshot: h02-landscape
- copyTextFrom: '(라이트|다크) 모드로 전환'
- retry:
    maxRetries: 2
    commands:
      - tapOn: '(라이트|다크) 모드로 전환'
      - assertNotVisible: ${maestro.copiedText}

- setOrientation: PORTRAIT
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-environment-use-system'
      - assertVisible:
          id: 'lab-environment-theme-source'
          text: 'system'
