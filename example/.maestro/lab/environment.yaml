appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- takeScreenshot: home
- runFlow: ../common/open-lab.yaml
- scrollUntilVisible:
    element:
      id: 'lab-environment-card'
    direction: DOWN
- takeScreenshot: lab-index
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'lab-environment-card'
      - assertVisible:
          id: 'lab-environment-expo'
- assertVisible:
    id: 'lab-environment-expo'
    text: '58\..*'
- assertVisible:
    id: 'lab-environment-rn'
    text: '0\.88\..*'
- assertVisible:
    id: 'lab-environment-react'
    text: '19\.3\..*'
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: 'lab-environment-os'
          text: 'ios 27.*'
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: 'lab-environment-os'
          text: 'android 3[6-9].*'
- takeScreenshot: lab-environment
