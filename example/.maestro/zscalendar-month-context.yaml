appId: kr.co.studio0610.zsui.example
---
- runFlow:
    file: common/open-calendar-advanced.yaml
    env:
      DATE: '2026-09-21'
- assertVisible: '보기 month'
- assertVisible: '2026년 9월'

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - waitForAnimationToEnd
      - assertVisible: '2026년 10월'
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - waitForAnimationToEnd
      - assertVisible: '2026년 11월'
- tapOn:
    id: 'calendar-cell-2026-11-03'
- assertVisible: '.*11월 3일.*선택됨.*'
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT
      - waitForAnimationToEnd
      - assertVisible: '2026년 10월'
- takeScreenshot: m01-october-month

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: UP
      - waitForAnimationToEnd
      - assertVisible: '보기 week'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-09-27'
- assertVisible:
    id: 'calendar-cell-2026-10-03'
- assertNotVisible:
    id: 'calendar-cell-2026-10-04'
- takeScreenshot: m02-week-keeps-october

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'calendar-cell-2026-10-03'
          direction: DOWN
          duration: 300
      - waitForAnimationToEnd
      - assertVisible: '보기 month'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-10-31'
- takeScreenshot: m03-expanded-october

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - waitForAnimationToEnd
      - assertVisible: '2026년 11월'
- assertVisible: '.*11월 3일.*선택됨.*'
- takeScreenshot: m04-selection-kept

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT
      - waitForAnimationToEnd
      - assertVisible: '2026년 10월'
- tapOn:
    id: 'calendar-cell-2026-10-01'
- assertVisible: '.*10월 1일.*선택됨.*'
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: UP
      - waitForAnimationToEnd
      - assertVisible: '보기 week'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-10-01'
- takeScreenshot: m05-first-row-selection

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT
      - waitForAnimationToEnd
      - assertVisible: '2026년 9월'
- assertVisible:
    id: 'calendar-cell-2026-09-20'
- takeScreenshot: m06-left-october-grid
