# 경계 주로 접혀도 보고 있던 달이 유지되는지 — 2026-10 그리드의 첫 행(09-27~10-03)은 9월이 과반이다.
# 이 주를 과반으로 다시 판정하면 10월을 보다 접었는데 9월로 밀린다.
appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
# 콜드 스타트는 Metro 번들 로드까지 1분 가까이 걸린다 — 홈이 뜬 뒤에 스크롤한다
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'calendar-card'
    direction: DOWN
- tapOn:
    id: 'calendar-card'
- assertVisible:
    id: 'diary-calendar-grid'
- extendedWaitUntil:
    visible: '.*일정 .*건.*'
    timeout: 8000
- assertVisible: '보기 month'
- assertVisible: '2026년 9월'

# 1) 선택일이 보이는 달과 다른 경우 — 11/3 을 고른 뒤 10월로 되돌아온다
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: LEFT
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: LEFT
- assertVisible: '2026년 11월'
- tapOn:
    id: 'calendar-cell-2026-11-03'
- assertVisible: '.*11월 3일.*선택됨.*'
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible: '2026년 10월'
- takeScreenshot: m01-october-month

# 접으면 10월의 첫 주가 남고, 제목은 10월 그대로여야 한다 (회귀 전에는 9월로 밀렸다)
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: UP
- waitForAnimationToEnd
- assertVisible: '보기 week'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-09-27'
- assertVisible:
    id: 'calendar-cell-2026-10-03'
- assertNotVisible:
    id: 'calendar-cell-2026-10-04'
- takeScreenshot: m02-week-keeps-october

# 다시 펼쳐도 떠나온 10월로 돌아온다
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: DOWN
- waitForAnimationToEnd
- assertVisible: '보기 month'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-10-31'
- takeScreenshot: m03-expanded-october

# 선택은 11/3 그대로 — 11월로 가면 리스트가 그날을 계속 가리키고 있다
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: LEFT
- waitForAnimationToEnd
- assertVisible: '2026년 11월'
- assertVisible: '.*11월 3일.*선택됨.*'
- takeScreenshot: m04-selection-kept

# 2) 선택일이 그 달의 첫 행에 있어도 밀리지 않는다 — 10/1 선택 후 접기
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: RIGHT
- waitForAnimationToEnd
- tapOn:
    id: 'calendar-cell-2026-10-01'
- assertVisible: '.*10월 1일.*선택됨.*'
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: UP
- waitForAnimationToEnd
- assertVisible: '보기 week'
- assertVisible: '2026년 10월'
- assertVisible:
    id: 'calendar-cell-2026-10-01'
- takeScreenshot: m05-first-row-selection

# 3) 주를 더 넘겨 10월 그리드를 벗어나는 순간에만 9월로 넘어간다
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: RIGHT
- waitForAnimationToEnd
- assertVisible:
    id: 'calendar-cell-2026-09-20'
- assertVisible: '2026년 9월'
- takeScreenshot: m06-left-october-grid
