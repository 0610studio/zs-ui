# 기기 폭별 회귀 — 소형폰·태블릿에서 그리드가 깨지지 않고 상호작용이 유지되는지.
appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
# Android 콜드 스타트는 Metro 번들 로드까지 1분 가까이 걸린다 — 홈이 뜬 뒤에 스크롤한다
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'calendar-card'
    direction: DOWN
- tapOn:
    id: 'calendar-card'
- assertVisible:
    id: 'diary-calendar-grid'
- extendedWaitUntil:
    visible: '.*일정 .*건.*'
    timeout: 8000
- takeScreenshot: r1-month
- tapOn:
    id: 'theme-toggle'
- takeScreenshot: r2-dark
- tapOn:
    id: 'theme-toggle'
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: UP
- takeScreenshot: r3-week
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: LEFT
- takeScreenshot: r4-week-swiped
