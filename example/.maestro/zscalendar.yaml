# ZSCalendar 통합 데모 검증 (기획서 §8 QA 체크리스트).
appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
# Android 콜드 스타트는 Metro 번들 로드까지 1분 가까이 걸린다 — 홈이 뜬 뒤에 스크롤한다
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'calendar-card'
    direction: DOWN
- tapOn:
    id: 'calendar-card'
- assertVisible:
    id: 'diary-calendar-grid'
- extendedWaitUntil:
    visible: '.*일정 .*건.*'
    timeout: 8000
# 에뮬레이터는 Skia 첫 프레임이 텍스트보다 늦어 곧바로 찍으면 빈 캔버스가 남는다
- waitForAnimationToEnd
- takeScreenshot: c01-month

# 1) 좌우 스와이프 — 도착 페이지에 dot 이 이미 있어야 한다
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: LEFT
- waitForAnimationToEnd
- takeScreenshot: c02-next-month
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: RIGHT
- waitForAnimationToEnd
- takeScreenshot: c03-back

# 2) 날짜 탭 → 리스트 갱신
- tapOn:
    id: 'calendar-cell-2026-09-11'
- assertVisible: '.*9월 11일.*'
- takeScreenshot: c04-selected

# 3) 상하 팬으로 주↔월 전환
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: UP
- takeScreenshot: c05-week
- swipe:
    from:
      id: 'diary-calendar-grid'
    direction: DOWN
- takeScreenshot: c06-month-again

# 4) 리스트는 고른 하루치만 보여준다 — 9일은 시드 데이터에서 2건이라 뷰포트 안에 다 들어온다
- tapOn:
    id: 'calendar-cell-2026-09-09'
- assertVisible: '2026-09-09 · 일정 2건'
- takeScreenshot: c07-single-day

# 5) 스크롤 연동을 끄면 목록을 튕겨도 보기 모드가 바뀌지 않는다
#    (짧은 목록 가드는 화면 폭에 따라 2건도 뷰포트를 넘길 수 있어 단위 테스트에 맡긴다)
- assertVisible: '보기 month'
- tapOn:
    id: 'scroll-transition-toggle'
- assertVisible: '스크롤 전환 끔'
- swipe:
    from:
      id: 'diary-list'
    direction: UP
- assertVisible: '보기 month'
- takeScreenshot: c08-no-spurious-transition
- tapOn:
    id: 'scroll-transition-toggle'
- assertVisible: '스크롤 전환 켬'

# 6) 다크 모드
- tapOn:
    id: 'theme-toggle'
- takeScreenshot: c09-dark
- tapOn:
    id: 'theme-toggle'
