appId: kr.co.studio0610.zsui.example
---
- runFlow:
    file: common/open-calendar-advanced.yaml
    env:
      DATE: '2026-09-02'
- waitForAnimationToEnd
- takeScreenshot: c01-month

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: LEFT
      - waitForAnimationToEnd
      - assertVisible: '2026년 10월'
- takeScreenshot: c02-next-month
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: RIGHT
      - waitForAnimationToEnd
      - assertVisible: '2026년 9월'
- takeScreenshot: c03-back

- tapOn:
    id: 'calendar-cell-2026-09-11'
- assertVisible: '.*9월 11일.*'
- takeScreenshot: c04-selected

- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'diary-calendar-grid'
          direction: UP
      - waitForAnimationToEnd
      - assertVisible: '보기 week'
- takeScreenshot: c05-week
- retry:
    maxRetries: 2
    commands:
      - swipe:
          from:
            id: 'calendar-cell-2026-09-11'
          direction: DOWN
          duration: 300
      - waitForAnimationToEnd
      - assertVisible: '보기 month'
- takeScreenshot: c06-month-again

- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'calendar-cell-2026-09-09'
      - assertVisible: '2026-09-09 · 일정 2건'
- takeScreenshot: c07-single-day

- assertVisible: '보기 month'
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'scroll-transition-toggle'
      - assertVisible: '스크롤 전환 끔'
- swipe:
    from:
      id: 'diary-list'
    direction: UP
- assertVisible: '보기 month'
- takeScreenshot: c08-no-spurious-transition
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'scroll-transition-toggle'
      - assertVisible: '스크롤 전환 켬'

- tapOn: '(라이트|다크) 모드로 전환'
- takeScreenshot: c09-dark
- tapOn: '(라이트|다크) 모드로 전환'
