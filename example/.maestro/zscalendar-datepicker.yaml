# 연월 탭 → 바텀시트 날짜 선택기(바라봄 DatePickerNativeModal 포팅).
# 휠 선택 · 숫자 8자리 입력으로 다른 달 이동 · 존재하지 않는 날짜 오류.
appId: kr.co.studio0610.zsui.example
---
- launchApp:
    clearState: false
# Android 콜드 스타트는 Metro 번들 로드까지 1분 가까이 걸린다 — 홈이 뜬 뒤에 스크롤한다
- extendedWaitUntil:
    visible: 'ZS-UI'
    timeout: 120000
- scrollUntilVisible:
    element:
      id: 'calendar-card'
    direction: DOWN
- tapOn:
    id: 'calendar-card'
- extendedWaitUntil:
    visible: '.*일정 .*건.*'
    timeout: 30000
- waitForAnimationToEnd
# 연월 탭 → 휠 선택기
- tapOn:
    id: 'calendar-header-title'
- assertVisible:
    id: 'date-picker-sheet'
- assertVisible:
    id: 'date-picker-wheel'
- takeScreenshot: dp01-wheel
# 입력 모드로 10월 15일
- tapOn: '입력'
- assertVisible:
    id: 'date-picker-input'
- tapOn:
    id: 'date-picker-input'
- inputText: '20261015'
- takeScreenshot: dp02-input
- tapOn:
    id: 'date-picker-confirm'
- waitForAnimationToEnd
- assertVisible: '2026년 10월'
- assertVisible: '2026-10-15 · 일정 .*건'
- assertVisible:
    id: 'calendar-cell-2026-10-15'
- takeScreenshot: dp03-moved
# 존재하지 않는 날짜는 오류
- tapOn:
    id: 'calendar-header-title'
- assertVisible:
    id: 'date-picker-sheet'
- tapOn:
    id: 'date-picker-input'
- inputText: '20260230'
- tapOn:
    id: 'date-picker-confirm'
- assertVisible:
    id: 'date-picker-error'
- takeScreenshot: dp04-error
