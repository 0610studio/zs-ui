appId: kr.co.studio0610.zsui.example
---
- runFlow:
    file: common/open-calendar-advanced.yaml
    env:
      DATE: '2026-09-02'
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'calendar-header-title'
      - assertVisible:
          id: 'date-picker-sheet'
- assertVisible:
    id: 'date-picker-wheel'
- takeScreenshot: dp01-wheel
- retry:
    maxRetries: 2
    commands:
      - tapOn: '입력'
      - assertVisible:
          id: 'date-picker-input'
- tapOn:
    id: 'date-picker-input'
- inputText: '20261015'
- takeScreenshot: dp02-input
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'date-picker-confirm'
      - assertVisible: '2026년 10월'
- waitForAnimationToEnd
- assertVisible: '2026-10-15 · 일정 .*건'
- assertVisible:
    id: 'calendar-cell-2026-10-15'
- takeScreenshot: dp03-moved
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'calendar-header-title'
      - assertVisible:
          id: 'date-picker-sheet'
- tapOn:
    id: 'date-picker-input'
- inputText: '20260230'
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'date-picker-confirm'
      - assertVisible:
          id: 'date-picker-error'
- takeScreenshot: dp04-error
