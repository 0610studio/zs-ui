name: 문서 품질 검사

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'example/**'
      - 'src/**'
      - 'package.json'
      - '.github/workflows/docs-quality.yml'

permissions:
  contents: read

jobs:
  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: pnpm 설정
        uses: pnpm/action-setup@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 워크스페이스 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 문서 검사
        run: pnpm --filter docs run check
